<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AZURA — WebAR Portfolio</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:system-ui, sans-serif; }
    #start {
      position:fixed; inset:0; z-index:10; display:grid; place-items:center;
      background:linear-gradient(180deg, #d7eef4, #8bcbdc); color:#123;
      text-align:center; padding:24px;
    }
    #start button {
      border:0; border-radius:999px; padding:14px 22px; font-weight:700;
      background:white; color:#123; box-shadow:0 8px 24px rgba(0,0,0,.18);
    }
    #hint { position:fixed; left:16px; right:16px; bottom:16px; z-index:5; color:white; text-align:center; font-size:14px; text-shadow:0 2px 8px #000; }
  </style>
</head>

<body>
  <div id="start">
    <div>
      <h1>AZURA — Expérience AR</h1>
      <p>Autorise la caméra, puis vise l’image imprimée du parfum.</p>
      <button id="startButton">Lancer l’expérience</button>
    </div>
  </div>
  <div id="hint">Vise l’image AZURA pour faire apparaître la vidéo.</div>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="azuraVideo" src="./assets/azura-video.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Vidéo flottante au-dessus de l’image cible -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-plane
        id="floatingVideo"
        material="shader: flat; src: #azuraVideo; transparent: true; opacity: 0.96"
        position="0 0.12 0.28"
        rotation="-18 0 0"
        width="1.55"
        height="0.87">
      </a-plane>
    </a-entity>
  </a-scene>

  <script>
    const startLayer = document.querySelector('#start');
    const startButton = document.querySelector('#startButton');
    const sceneEl = document.querySelector('a-scene');
    const video = document.querySelector('#azuraVideo');
    const target = document.querySelector('#target');

    startButton.addEventListener('click', async () => {
      startLayer.style.display = 'none';
      await sceneEl.systems['mindar-image-system'].start();
    });

    target.addEventListener('targetFound', () => {
      video.play();
    });

    target.addEventListener('targetLost', () => {
      video.pause();
    });
  </script>
</body>
</html>
